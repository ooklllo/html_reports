<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Archive</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(56, 139, 253, 0.15);
      color: #58a6ff;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(56, 139, 253, 0.3);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #2ea043;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 6px #2ea043;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #f0f6fc;
      margin-bottom: 12px;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      color: #8b949e;
      margin-bottom: 28px;
    }

    .divider {
      border-top: 1px solid #21262d;
      padding-top: 20px;
      font-size: 12px;
      color: #484f58;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-badge">
      <span class="status-dot"></span> Online
    </div>
    <h1>Report Repository</h1>
    <p>
      이 페이지는 보고서 저장소의 메인 엔드포인트입니다.<br>
      개별 보고서는 전달받은 고유 URL을 통해 열람하실 수 있습니다.
    </p>
    <div class="divider">
      Private / Direct URL Access Only
    </div>
  </div>
</body>
</html>
